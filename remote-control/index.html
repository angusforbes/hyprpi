<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><!-- light theme: dark clock on a light bar (J61) -->
<meta name="apple-mobile-web-app-title" content="hyprpi">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png"><!-- J61: π, option 4 -->
<link rel="stylesheet" href="/style.css">
<title>hyprpi · Thoughts</title>
</head>
<body>
<header id="top">
  <span id="dot" title="connection"></span>
  <nav id="worlds" aria-label="worlds"></nav>
  <nav id="tabs" aria-label="views">
    <button class="tab cur" data-tab="thoughts" title="Thoughts">Thgt</button>
    <button class="tab" data-tab="projects" title="Projects">Proj</button>
    <button class="tab" data-tab="agents" title="Agents">Agnt</button>
    <button class="tab" data-tab="stream" title="Stream">Strm</button>
    <button class="tab" data-tab="files" title="Files">Fils</button>
  </nav>
</header>
<main id="thread" aria-live="polite"></main>
<main id="projects" hidden></main>
<main id="agents" class="pane" hidden></main>
<main id="stream" class="pane" hidden></main>
<main id="files" class="pane" hidden></main>
<main id="session" class="pane" hidden></main><!-- J161: an agent's session -->
<div id="scomp" hidden><textarea id="sinput" rows="1" enterkeyhint="send" inputmode="text" autocapitalize="sentences" autocorrect="on" spellcheck="true" autocomplete="off" aria-label="message to the agent"></textarea><button type="button" id="sint" hidden title="stop its turn (like Esc)">Stop</button><button type="button" id="ssend" title="send (queued if it's working)">➤</button></div><!-- J141: the Files app, embedded (an iframe made on first use) -->
<!-- the Strm filter (J60): filter-only, never sends anything; a different look from the message box -->
<div id="sbar" hidden>
  <div id="skinds" aria-label="kinds"></div>
  <div class="srow"><span class="sicon">🔍</span><input id="sq" type="search" enterkeyhint="search" inputmode="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="filter: words · @Name · 3h · today" aria-label="filter the stream"><button id="sx" type="button" hidden title="clear the filter">✕</button></div>
</div>
<div id="note" hidden></div>
<div id="atts" hidden></div><!-- J219 (a): photos waiting to go with the next message -->
<div id="composer"><!-- not a <form> (J59): Safari's form bar has less to step through -->
  <button type="button" id="attach" title="add photos or files">📎</button><input id="attfile" type="file" multiple hidden>
  <textarea id="input" rows="1" enterkeyhint="send" inputmode="text" autocapitalize="sentences" autocorrect="on" spellcheck="true" autocomplete="off" aria-label="message to Thoughts"></textarea>
  <button type="button" id="stop" hidden title="stop Thoughts">■</button>
  <button type="button" id="send" title="send">➤</button>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
