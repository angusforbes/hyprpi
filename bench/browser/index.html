<!doctype html><html><head><title>J669 bench form</title></head><body style="font:18px sans-serif;margin:40px">
<h1>Upload form</h1>
<form id="f" onsubmit="event.preventDefault();const f=new FormData(this);document.getElementById('out').textContent='Submitted: '+f.get('name')+' / '+f.get('email')+' / plan='+f.get('plan')+' / agree='+(f.get('agree')?'yes':'no')+' / file='+(document.getElementById('file').files[0]?.name||'none');">
<p><label>Name <input id="name" name="name"></label></p>
<p><label>Email <input id="email" name="email" type="email"></label></p>
<p><label>Plan <select id="plan" name="plan"><option value="">Choose…</option><option>Basic</option><option>Pro</option></select></label></p>
<p><label><input id="agree" name="agree" type="checkbox"> I agree</label></p>
<p><label>File <input id="file" name="file" type="file"></label></p>
<p><button type="submit">Submit</button></p></form><p id="out"></p></body></html>
