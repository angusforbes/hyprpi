# hyprpi terminal helpers, kitty: settings for hyprpi agent windows only.
# hyprpi starts kitty agent windows with your own kitty.conf and then this file
# (kitty --config <yours> --config pi.conf), so these override yours there and
# nowhere else. Turn it off with "terminalHelpers": false in ~/.config/hyprpi/config.json.

include links.conf

# Ctrl+click: a link opens as before (links.conf); otherwise an agent's name under the pointer
# ("pi·ab12", "@Atlas", "Atlas[e]") jumps to that agent's window, as in the panels (@hyprpi N56;
# withdrawn 2026-10-01, on again 2026-10-08). agentclick-map.py prints the mapping with this
# checkout's own path. To turn it off, comment out the next line.
geninclude agentclick-map.py

# Select to copy (Herdr did this; handy for pi's output).
copy_on_select clipboard

# SUPER+C (Omarchy sends Ctrl+Insert): copy kitty's selection if there is one, otherwise pass
# Ctrl+Insert on to pi, whose editor-select extension copies its Shift+Arrow selection.
map ctrl+insert copy_or_noop
map shift+insert paste_from_clipboard

# Shift+Enter (new line in pi) and Alt+Shift+Enter as CSI-u, so they differ from Enter / Alt+Enter.
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u

# Ctrl+Shift+A straight to pi (select-all in editor-select). Kitty otherwise uses it as the
# prefix of its background-opacity shortcuts, which swallowed the first press.
map kitty_mod+a send_key ctrl+shift+a
