# hyprpi terminal helpers, kitty: Ctrl+click opens links and local files; plain clicks never do.
# Used by hyprpi agent windows (via pi.conf) and, if you like, every kitty window:
#   include ~/Work/hyprpi/terminal-helpers/kitty/links.conf     (in ~/.config/kitty/kitty.conf)
# Why it is set up this way: README.md in this folder.

# Treat file:// links like web URLs.
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
allow_hyperlinks yes
# Always underline real (OSC 8) hyperlinks so they read as Ctrl+clickable.
underline_hyperlinks always
url_style straight
# gio open honours Terminal=true defaults (runs them via xdg-terminal-exec); xdg-open starts them invisibly.
open_url_with gio open
# Plain clicks select/move the cursor; only Ctrl+click opens links.
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed,ungrabbed discard_event
