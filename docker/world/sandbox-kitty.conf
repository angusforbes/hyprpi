# kitty for a SANDBOXED hyprpi world's windows (J262, review finding #1). These windows show bytes from an
# untrusted sandbox, so the window itself must not become a bridge to the host. Used INSTEAD of Angus's
# kitty.conf and hyprpi's pi.conf (world-helper.mjs passes only this file, plus -o overrides).
# Note: no config can stop kitty's graphics protocol from being asked to show a host image file; the
# helper runs the window under a PTY filter for that (g-filter in world-helper).

# No clipboard writes or reads by the program (OSC 52), no remote control, no listening socket.
clipboard_control no-append
allow_remote_control no
listen_on none
# Links: shown as text, never opened from a click (no host gio-open, no agent-name jump, no file://).
allow_hyperlinks no
detect_urls no
open_url_with none
mouse_map ctrl+left release grabbed,ungrabbed no_op
mouse_map ctrl+left press grabbed,ungrabbed no_op
mouse_map ctrl+shift+left release grabbed,ungrabbed no_op
# No host shells from inside this window: unmap every key that starts a new window, tab, or program.
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+equal change_font_size current +1.0
map ctrl+shift+minus change_font_size current -1.0
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
# No desktop notifications or shell integration from the program, and no file transfer.
notify_on_cmd_finish never
shell_integration disabled
file_transfer_confirmation_bypass
confirm_os_window_close 0
copy_on_select clipboard
