# kitty for a SANDBOXED hyprpi world's windows (J262, review finding #1). These windows show bytes from an
# untrusted sandbox, so the window itself must not become a bridge to the host. world-helper.mjs writes a
# window's config as Angus's VISUAL settings (font, padding, theme colours; a fixed list of keys) followed by
# this file, which comes last and so always wins.
# Note: no config can stop kitty's graphics protocol from being asked to show a host image file; the
# helper runs the window under a PTY filter for that (g-filter in world-helper).

# No clipboard writes or reads by the program (OSC 52), no remote control, no listening socket.
clipboard_control no-append
allow_remote_control no
listen_on none
# Links (J320): Ctrl+click opens a link that is visibly in the text (detect_urls; hidden OSC 8 targets stay off and
# are stripped by g-filter), and only through g_open_url.py (@G_OPEN@ becomes its absolute path): http(s), and file://
# inside the folders shared with this sandbox (not hidden ones), into the current world's Brave window. Other
# schemes are refused. A plain click selects text as usual.
allow_hyperlinks no
detect_urls yes
url_prefixes http https file
url_excluded_characters "'`<>
open_url_with @G_OPEN@
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed,ungrabbed discard_event
mouse_map ctrl+shift+left release grabbed,ungrabbed no_op
# No host shells from inside this window: unmap every key that starts a new window, tab, or program.
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Ctrl+V and Shift+Insert: g_paste.py (@G_PASTE@ becomes its absolute path in world-helper kittyConf) (host kitten, J307): a clipboard IMAGE is saved to ~/Screenshots (shared into the
# sandbox) and its path typed; text is a normal paste. Runs on the host, reads only the clipboard, types only into this window.
map ctrl+v kitten @G_PASTE@
# as hyprpi's pi.conf for agent windows (kitty's own copy / paste; Shift+Enter keys Pi needs)
map ctrl+insert copy_or_noop
map shift+insert kitten @G_PASTE@
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u
map kitty_mod+a send_key ctrl+shift+a
map ctrl+shift+equal change_font_size current +1.0
map ctrl+shift+minus change_font_size current -1.0
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
# No desktop notifications or shell integration from the program, and no file transfer.
notify_on_cmd_finish never
shell_integration disabled
confirm_os_window_close 0
copy_on_select clipboard
